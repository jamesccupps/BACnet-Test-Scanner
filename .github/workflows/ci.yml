name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # v4/v5 rather than the newer v5/v6. These are the versions running
      # green in this account's other repo today; the newer pair was a
      # speculative bump to silence a Node 20 deprecation notice and every
      # job failed within seconds of setup. The notice is cosmetic; a red
      # matrix is not.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check tkinter is available
        shell: python
        run: |
          # The scanner imports tkinter at module scope, so every test needs
          # it. Checking explicitly turns a missing Tk into one clear line
          # instead of 30-odd confusing collection errors.
          import tkinter
          print("tkinter", tkinter.TkVersion)

      - name: Syntax check
        run: python -m compileall -q p2_bridge_scanner.py

      - name: Run tests
        run: python -m pytest -v

      - name: Import smoke test
        shell: python
        run: |
          # The GUI needs a display, but importing the module exercises the
          # dataclasses, the bacpypes3 imports and the module-level logger —
          # which is where a bad refactor shows up first.
          import p2_bridge_scanner as s
          assert callable(s.main)
          assert s._format_status_flags(None) == ""
          print("import OK")
